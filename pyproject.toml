[project]
name = "rag-multimodal-agentique"
version = "0.1.0"
description = "RAG multimodal local avec LlamaIndex, CLIP, Ollama et PGVector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.14.20,<0.15",
    "llama-index-llms-ollama>=0.10.1,<0.11",
    "llama-index-vector-stores-postgres>=0.9.0,<0.10",
    "pymupdf>=1.26,<2",
    "transformers>=4.48.3,<5",
    "torch>=2.6,<3",
    "pillow>=10,<13",
    "python-dotenv>=1,<2",
    "httpx>=0.27,<1",
    "psycopg2-binary>=2.9.9,<3",
    "sqlalchemy>=2,<2.1",
    "ipykernel>=6,<8",
    "nbformat>=5.10,<6",
    "llama-index-readers-file>=0.7.0",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-vector-stores-chroma>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.4",
    "llama-index-embeddings-clip>=0.7.0",
    "streamlit>=1.66.1",
    "langchain>=1.2.10,<2",
    "langchain-ollama>=1.0.1,<2",
    "clip",
]

[build-system]
requires = ["setuptools>=80.9,<82"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
